<title>PLUG 자료실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style id="app-style">
/* Layout: sticky logo header band, left category rail + reading column; rail becomes a drawer under 900px */
:root{
  --brand:#1947ba; --accent:#ffb71b; --header-light:#eef3fc;
  --bg:#f5f7fb; --surface:#ffffff; --surface-2:#eef2f9; --ink:#14203a; --ink-2:#4b5770; --ink-3:#7a849a;
  --line:#dce3ef; --header-bg:var(--header-light); --brand-ink:var(--brand);
  --ok:#2b8a3e; --ok-soft:#e6f4ea; --bad:#c92a2a; --bad-soft:#fdecec;
  --shadow:0 1px 2px rgba(20,32,58,.06),0 4px 16px rgba(20,32,58,.06);
  --f-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --radius:14px; --logo-l:block; --logo-d:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1322; --surface:#141c30; --surface-2:#1b2540; --ink:#e8edf8; --ink-2:#aab4ca; --ink-3:#7d88a1;
  --line:#28334f; --header-bg:#111a2d; --brand-ink:color-mix(in srgb,var(--brand) 50%,#ffffff);
  --ok:#69db7c; --ok-soft:#14321f; --bad:#ff8787; --bad-soft:#3a1717;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --logo-l:none; --logo-d:block; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1322; --surface:#141c30; --surface-2:#1b2540; --ink:#e8edf8; --ink-2:#aab4ca; --ink-3:#7d88a1;
  --line:#28334f; --header-bg:#111a2d; --brand-ink:color-mix(in srgb,var(--brand) 50%,#ffffff);
  --ok:#69db7c; --ok-soft:#14321f; --bad:#ff8787; --bad-soft:#3a1717;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --logo-l:none; --logo-d:block; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px;border-radius:6px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--header-bg);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.hdr-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:10px}
.logo{display:block;flex:none;line-height:0}
.logo img{height:52px;width:auto}
.logo .logo-l{display:var(--logo-l)}
.logo .logo-d{display:var(--logo-d)}
.hdr-search{flex:1;max-width:420px;margin-left:auto;position:relative}
.hdr-search input{width:100%;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 16px 0 40px;font-size:15px}
.hdr-search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.icon-btn{height:42px;min-width:42px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:14px;font-weight:600}
.icon-btn:hover{border-color:var(--brand)}
.menu-btn{display:none}
.edit-btn{background:var(--brand);color:#fff;border-color:var(--brand)}
.edit-btn.on{background:var(--accent);color:#1b1400;border-color:var(--accent)}

/* shell */
.shell{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:268px minmax(0,1fr);gap:40px;padding-block:28px 80px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 104px);align-self:start;max-height:calc(100vh - 124px);overflow:auto;padding-right:4px}
.rail-home{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;text-decoration:none;font-weight:600}
.rail-group{margin-top:18px}
.rail-group h4{margin:0 0 6px;padding:0 12px;font-size:12px;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.rail-grp{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;font-size:16px;font-weight:700;line-height:1.4;color:var(--ink)}
.rail-grp:hover{background:var(--surface-2)}
.rail-grp.has-cur{color:var(--brand-ink)}
.rail-grp .chev{flex:none;transition:transform .15s;color:var(--ink-3)}
.rail-grp[aria-expanded="true"] .chev{transform:rotate(90deg)}
.rail-grp .n{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:500}
.rail-grp-body{margin:2px 0 4px 14px;padding-left:8px;border-left:2px solid var(--line)}
.rail-sec{margin-top:18px}
.rail-sec-h{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:12px 12px;border-radius:12px;font-size:17px;font-weight:800;line-height:1.35;color:var(--ink);letter-spacing:-.01em}
.rail-sec-h:hover{background:var(--surface-2)}
.rail-sec-h.has-cur{color:var(--brand-ink)}
.rail-sec-h .chev{flex:none;transition:transform .15s;color:var(--ink-3)}
.rail-sec-h[aria-expanded="true"] .chev{transform:rotate(90deg)}
.rail-sec-h .n{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:500}
.rail-sec-body{margin:0 0 4px 8px}
.rail-sec .rail-group{margin-top:2px}
.sec-big{font-weight:800;font-size:clamp(30px,4vw,40px);letter-spacing:-.03em;margin:64px 0 -24px;line-height:1.2;color:var(--brand-ink)}
.grp-h.in-sec{font-size:clamp(22px,2.8vw,28px)}
.rail-cat{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;text-decoration:none;font-weight:600;font-size:15px;line-height:1.4}
.rail-cat .n{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:500;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c,var(--brand))}
.rail a:hover{background:var(--surface-2)}
.rail a.cur{background:color-mix(in srgb,var(--brand) 12%,var(--surface));color:var(--brand-ink)}
.rail-posts{list-style:none;margin:2px 0 6px 17px;padding:0 0 0 12px;border-left:2px solid var(--line)}
.rail-posts a{display:block;padding:5px 10px;border-radius:8px;text-decoration:none;font-size:14px;color:var(--ink-2);line-height:1.45}
.rail-posts a b{font-weight:600;color:var(--ink-3);margin-right:6px;font-size:12px}
.scrim{display:none}

main{min-width:0}

/* home */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px 32px 28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:var(--accent);opacity:.18}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--brand-ink)}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4.4vw,44px);line-height:1.2;margin:6px 0 10px;text-wrap:balance;color:var(--ink)}
.hero p{margin:0;max-width:62ch;color:var(--ink-2)}
.hero>*{position:relative;z-index:1}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:22px;position:relative;z-index:1}
.stat b{font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--brand-ink);margin-right:6px;font-variant-numeric:tabular-nums}
.stat span{color:var(--ink-2);font-size:14px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:40px 0 14px}
.sec-h h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;line-height:1.3}
.sec-h p{margin:0;color:var(--ink-3);font-size:14px}
.sec-h a{margin-left:auto;font-size:14px;color:var(--brand-ink);font-weight:600;text-decoration:none;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;text-decoration:none;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--c,var(--brand));transform:translateY(-2px)}
.card .lab{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-3)}
.card .lab i{font-style:normal;color:var(--c,var(--brand));}
.card h3{margin:0;font-size:19px;line-height:1.4;font-weight:700}
.card ol{margin:4px 0 0;padding:0;list-style:none;font-size:14px;color:var(--ink-2);display:grid;gap:2px}
.card ol li{display:flex;gap:8px;line-height:1.5}
.card ol li span{color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}

/* category page */
.page-h{margin-bottom:22px}
.page-h h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4vw,38px);line-height:1.25;margin:4px 0 6px;text-wrap:balance}
.page-h p{margin:0;color:var(--ink-2)}
.crumb{font-size:14px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumb a{text-decoration:none;color:var(--ink-2)}
.crumb a:hover{color:var(--brand-ink)}

/* post */
.post-h{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:8px}
.post-h .tag{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--c,var(--brand));margin-top:10px}
.post-h h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4.6vw,46px);line-height:1.2;margin:4px 0 8px;text-wrap:balance}
.post-h .intro{color:var(--ink-2);max-width:65ch;margin:0;white-space:pre-line}
.jump{position:sticky;top:calc(env(safe-area-inset-top,0px) + 73px);z-index:5;background:var(--bg);display:flex;gap:8px;padding:12px 0;overflow-x:auto;scrollbar-width:none}
.jump button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.jump button:hover{border-color:var(--brand);color:var(--brand-ink)}
.lesson{margin-top:26px;scroll-margin-top:150px}
.lesson-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.lesson-h .no{flex:none;background:var(--brand);color:#fff;font-family:var(--f-display);font-size:18px;padding:4px 12px;border-radius:10px;line-height:1.4}
.lesson-h h2{margin:0;font-size:clamp(21px,2.6vw,26px);line-height:1.35;font-weight:700;text-wrap:balance}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-top:12px}
.blk h3{margin:0 0 10px;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;color:var(--brand-ink)}
.blk h3::before{content:"";width:6px;height:16px;border-radius:3px;background:var(--accent)}
.blk ul,.blk ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.blk li{padding-left:2px}
.blk li::marker{color:var(--ink-3)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
.two .blk{margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0!important}
.chips li{background:var(--surface-2);border-radius:8px;padding:5px 12px;font-size:15px;line-height:1.5}
.sum li::marker{content:"✓  ";color:var(--brand-ink);font-weight:700}
.sum{padding-left:1.6em!important}
.text-body{white-space:pre-line}

/* detail + summary */
.grp-h{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,3.4vw,34px);margin:52px 0 -18px;padding-bottom:10px;border-bottom:2px solid var(--line);line-height:1.3}
.sum-h{margin:14px 0 6px;font-size:16px;font-weight:700}
.sum-h:first-child{margin-top:0}
.blk.detail{padding:0;overflow:hidden}
.detail>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:16px 22px;font-weight:700;color:var(--brand-ink)}
.detail>summary::-webkit-details-marker{display:none}
.detail>summary::before{content:"";width:8px;height:8px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
.detail[open]>summary::before{transform:rotate(45deg)}
.detail>summary small{font-weight:500;color:var(--ink-3);font-size:13px}
.detail-b{padding:4px 22px 20px;border-top:1px solid var(--line)}
.d-h1{font-size:18px;margin:20px 0 6px;line-height:1.45}
.d-h2{font-size:16px;margin:14px 0 6px;color:var(--brand-ink);line-height:1.45}
.d-list{margin:0 0 6px;padding-left:1.2em;display:grid;gap:4px}
.d-sub{margin:4px 0 2px;padding-left:1.1em;list-style:circle;color:var(--ink-2);font-size:15px;display:grid;gap:2px}
.d-p{margin:4px 0;color:var(--ink-2)}
.refs{margin-top:18px;font-size:14px;color:var(--ink-3)}
.refs summary{cursor:pointer;font-weight:600}
.refs ul{padding-left:1.2em;margin:6px 0 0}
.tbl-wrap{overflow-x:auto;margin-top:8px}
.tbl-wrap table{border-collapse:collapse;min-width:640px;width:100%;font-size:14px;line-height:1.55}
.tbl-wrap th,.tbl-wrap td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl-wrap thead th{background:var(--surface-2);font-weight:700}
.tbl-wrap tbody th{font-weight:700;white-space:nowrap}

.outline>li>b{font-weight:600}
.outline ul{margin:4px 0 2px;padding-left:1.1em;list-style:circle;color:var(--ink-2);font-size:15px;display:grid;gap:2px}
.outline ul li::marker{content:normal;color:var(--ink-3)}
.passage{margin:0 0 12px;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:15px;white-space:pre-line}
.hint-q{margin:0;color:var(--ink-3);font-size:14px}
.easy p{margin:0 0 10px}
.easy p:last-child{margin-bottom:0}
.caution{border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}
.caution h3::before{background:var(--bad)}
.caution .sum.bad li::marker{content:"✕  ";color:var(--bad)}
.caution .sum.good li::marker{content:"✓  ";color:var(--ok)}
.caution .sum-h.good{color:var(--ok)}
.key{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.key p{margin:0 0 10px}.key p:last-child{margin-bottom:0}
.tip{background:color-mix(in srgb,var(--brand) 6%,var(--surface));border-color:color-mix(in srgb,var(--brand) 30%,var(--line))}
.tip p{margin:0}
.terms{margin:0;display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:8px 16px;padding-top:14px}
.terms dt{font-weight:700}
.terms dd{margin:0;color:var(--ink-2)}
@media (max-width:600px){.terms{grid-template-columns:minmax(0,1fr);gap:2px}.terms dd{margin-bottom:10px}}
/* quiz */
.quiz{background:color-mix(in srgb,var(--accent) 9%,var(--surface));border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.quiz .q{font-weight:600;margin:0 0 12px;line-height:1.6}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;line-height:1.55}
.opt:hover:not([disabled]){border-color:var(--brand)}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink-3);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:1px}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.explain{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px dashed var(--line);font-size:15px}
.explain b{color:var(--brand-ink)}
.quiz-foot{display:flex;gap:8px;margin-top:10px}
.link-btn{border:0;background:none;color:var(--brand-ink);font-weight:600;font-size:14px;padding:4px 0}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px}
.pager a{display:block;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px 18px;text-decoration:none}
.pager a:hover{border-color:var(--brand)}
.pager small{display:block;color:var(--ink-3);font-size:13px}
.pager b{font-weight:600}
.pager .nx{text-align:right;grid-column:2}

/* search */
.result{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;text-decoration:none;margin-bottom:10px}
.result:hover{border-color:var(--brand)}
.result small{color:var(--ink-3);font-size:13px}
.result b{display:block;font-size:17px}
.result p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
mark{background:color-mix(in srgb,var(--accent) 55%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.empty{color:var(--ink-3);padding:30px 0}

/* edit mode */
.editbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);color:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.editbar-in{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-block:10px}
.editbar .msg{font-size:14px;margin-right:auto;min-width:0}
.editbar .msg b{color:var(--accent)}
.btn{border:1px solid transparent;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;background:var(--surface-2);color:var(--ink);line-height:1.3}
.btn.pri{background:var(--brand);color:#fff}
.btn.acc{background:var(--accent);color:#1b1400}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:transparent}
.btn.danger.arm{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.editbar .btn.ghost{color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.inline-edit{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.notice{margin-bottom:16px;padding:12px 16px;border-radius:12px;background:color-mix(in srgb,var(--accent) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 50%,var(--line));font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(10,16,30,.45);display:flex;justify-content:flex-end}
.sheet{width:min(720px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.sheet-h{display:flex;align-items:center;gap:10px;padding-block:14px;border-bottom:1px solid var(--line);background:var(--surface);padding-top:max(14px,env(safe-area-inset-top,0px))}
.sheet-h h2{margin:0;font-size:18px;font-weight:700;margin-right:auto}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:10px;border-bottom:1px solid var(--line);background:var(--surface)}
.tabs button{flex:none;border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink-2)}
.tabs button.on{background:var(--brand);color:#fff}
.sheet-b{flex:1;overflow:auto;padding-block:18px 60px}
.f{display:grid;gap:6px;margin-bottom:14px}
.f label,.f .lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.f small{color:var(--ink-3);font-size:12px}
.f input[type=text],.f textarea,.f select,.f input[type=number]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:15px;line-height:1.55}
.f textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.box{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;margin-bottom:14px}
.box-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}

function hash(s){var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0}return (h>>>0).toString(36)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}

function postsOf(cid){return state.posts.filter(function(p){return p.cat===cid})}
function postIndex(id){for(var i=0;i<state.posts.length;i++)if(state.posts[i].id===id)return i;return -1}
function dirty(){return JSON.stringify(state)!==SAVED}
function groups(){var g=[],m={};state.categories.forEach(function(c){var k=(c.section||'')+'\u0001'+(c.group||'');if(!(k in m)){m[k]=g.length;g.push({name:c.group||'',sec:c.section||'',cats:[]})}g[m[k]].cats.push(c)});return g}
function sections(){var s=[],m={};groups().forEach(function(g,gi){g.gi=gi;var k=g.sec;if(!(k in m)){m[k]=s.length;s.push({name:k,groups:[]})}s[m[k]].groups.push(g)});return s}
function orderedPosts(){var out=[];state.categories.forEach(function(c){out=out.concat(postsOf(c.id))});return out}

function rail(r){
  var curCat=r.v==='cat'?r.id:(r.v==='post'?((state.posts[postIndex(r.id)]||{}).cat):null);
  var h='<nav class="rail'+(ui.menu?' open':'')+'" aria-label="카테고리"><a class="rail-home'+(r.v==='home'?' cur':'')+'" href="#">'+IC.home+'처음으로</a>';
  var CHEV='<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
  function grpHtml(g){
    var gi=g.gi;
    var hasCur=g.cats.some(function(c){return c.id===curCat});
    var key=g.sec+'\u0001'+g.name;
    var open=!g.name||(key in ui.openGroups?ui.openGroups[key]:hasCur);
    var h='<div class="rail-group'+(g.name?' named':'')+'">';
    if(g.name)h+='<button class="rail-grp'+(hasCur?' has-cur':'')+'" data-act="grp" data-gi="'+gi+'" aria-expanded="'+open+'">'+CHEV+'<span>'+esc(g.name)+'</span><span class="n">'+g.cats.length+'</span></button>';
    if(!open)return h+'</div>';
    if(g.name)h+='<div class="rail-grp-body">';
    g.cats.forEach(function(c){
      var ps=postsOf(c.id);
      h+='<a class="rail-cat'+(r.v==='cat'&&r.id===c.id?' cur':'')+'" href="#c-'+esc(c.id)+'" style="--c:'+esc(safeColor(c.color,'#1947ba'))+'"><span class="dot"></span>'+esc(c.name)+'<span class="n">'+ps.length+'</span></a>';
      if(c.id===curCat&&ps.length){h+='<ul class="rail-posts">';ps.forEach(function(p){h+='<li><a href="#p-'+esc(p.id)+'"'+(r.v==='post'&&r.id===p.id?' class="cur"':'')+'>'+(p.label?'<b>'+esc(p.label)+'</b>':'')+esc(p.title)+'</a></li>'});h+='</ul>'}
    });
    if(g.name)h+='</div>';
    return h+'</div>';
  }
  sections().forEach(function(s,si){
    if(!s.name){s.groups.forEach(function(g){h+=grpHtml(g)});return}
    var hasCur=s.groups.some(function(g){return g.cats.some(function(c){return c.id===curCat})});
    var open=s.name in ui.openSecs?ui.openSecs[s.name]:hasCur;
    h+='<div class="rail-sec"><button class="rail-sec-h'+(hasCur?' has-cur':'')+'" data-act="sec" data-si="'+si+'" aria-expanded="'+open+'">'+CHEV+'<span>'+esc(s.name)+'</span><span class="n">'+s.groups.length+'</span></button>';
    if(open){h+='<div class="rail-sec-body">';s.groups.forEach(function(g){h+=grpHtml(g)});h+='</div>'}
    h+='</div>';
  });
  return h+'</nav>';
}
function noticeHtml(){if(!ui.notice)return '';return '<div class="notice">'+ui.notice.html+'</div>'}

}

function listHtml(arr,cls,ordered){if(!arr||!arr.length)return '';var t=ordered?'ol':'ul';return '<'+t+(cls?' class="'+cls+'"':'')+'>'+arr.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</'+t+'>'}
function quizHtml(q,key){
  var st=ui.quiz[key]||{};var done=st.picked!=null||st.reveal;var ans=Number(q.answer);
  var h='<div class="blk quiz"><h3>확인 퀴즈</h3><p class="q">'+esc(q.q)+'</p>'+(q.passage?'<div class="passage">'+esc(q.passage)+'</div>':'');
  if(!(q.options||[]).length){
    if(st.reveal)h+='<div class="explain" role="status"><b>정답: '+esc(q.answer)+'</b>'+(q.explain&&q.explain!=='정답 참조'?'<br>'+esc(q.explain):'')+'</div><div class="quiz-foot"><button class="link-btn" data-act="quiz-reset" data-key="'+esc(key)+'">정답 가리기</button></div>';
    else h+='<p class="hint-q">답을 먼저 떠올려 본 뒤 확인해 보세요.</p><div class="quiz-foot"><button class="btn pri" data-act="quiz-reveal" data-key="'+esc(key)+'">정답 보기</button></div>';
    return h+'</div>';
  }
  h+='<div class="opts">';
  (q.options||[]).forEach(function(o,i){var n=i+1;var cls='';
    if(done){if(n===ans)cls=' right';else if(st.picked===n)cls=' wrong'}
    h+='<button class="opt'+cls+'" data-act="pick" data-key="'+esc(key)+'" data-n="'+n+'"'+(done?' disabled':'')+'><span class="k">'+n+'</span><span>'+esc(o)+'</span></button>'});
  h+='</div>';
  if(done){h+='<div class="explain" role="status"><b>'+(st.picked==null?'정답 ':(st.picked===ans?'정답이에요! ':'아쉬워요. 정답은 '))+(CIRC[ans-1]||ans)+'</b>'+(q.explain?'<br>'+esc(q.explain):'')+'</div><div class="quiz-foot"><button class="link-btn" data-act="quiz-reset" data-key="'+esc(key)+'">다시 풀기</button></div>'}
  else h+='<div class="quiz-foot"><button class="link-btn" data-act="quiz-reveal" data-key="'+esc(key)+'">정답 바로 보기</button></div>';
  return h+'</div>';

function cautionHtml(arr){
  var h='',open=false,good=false;
  arr.forEach(function(x){
    if(/^## /.test(x)){if(open){h+='</ul>';open=false}good=/권장/.test(x);h+='<h4 class="sum-h'+(good?' good':'')+'">'+esc(x.slice(3))+'</h4>'}
    else{if(!open){h+='<ul class="sum'+(good?' good':' bad')+'">';open=true}h+='<li>'+esc(x)+'</li>'}
  });
  return h+(open?'</ul>':'');
}
function sumHtml(arr){
  var h='',open=false;
  arr.forEach(function(x){
    if(/^## /.test(x)){if(open){h+='</ul>';open=false}h+='<h4 class="sum-h">'+esc(x.slice(3))+'</h4>'}
    else{if(!open){h+='<ul class="sum">';open=true}h+='<li>'+esc(x)+'</li>'}
  });
  return h+(open?'</ul>':'');
}
function outlineHtml(lines){
  var items=[],cur=null,sub=null;
  lines.forEach(function(raw){
    var l=String(raw).trim();if(!l)return;var m;
    if((m=l.match(/^\d+\.\s*(.+)$/))){cur={t:m[1],kids:[]};items.push(cur);sub=null;return}
    if((m=l.match(/^(?:[-–•·]|\d+\)|[①-⑳])\s*(.+)$/))){var k={t:(/^\d+\)/.test(l)?l:m[1])};if(!cur){cur={t:'',kids:[]};items.push(cur)}cur.kids.push(k);sub=k;return}
    if(sub)sub.t+=' '+l;else if(cur)cur.t+=' '+l;else{cur={t:l,kids:[]};items.push(cur)}
  });
  return '<ul class="sum outline">'+items.map(function(it){return '<li>'+(it.t?'<b>'+esc(it.t)+'</b>':'')+(it.kids.length?'<ul>'+it.kids.map(function(k){return '<li>'+esc(k.t)+'</li>'}).join('')+'</ul>':'')+'</li>'}).join('')+'</ul>';
}
function tableHtml(t){
  return '<div class="tbl-wrap"><table><thead><tr>'+t.head.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody>'+t.rows.map(function(r){return '<tr>'+r.map(function(c,i){return i===0?'<th scope="row">'+esc(c)+'</th>':'<td>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>';
}
function detailHtml(lines){
  var h='',inList=false,inSub=false,inRef=false;
  function closeSub(){if(inSub){h+='</ul>';inSub=false}}
  function closeList(){closeSub();if(inList){h+='</li></ul>';inList=false}}
  lines.forEach(function(raw){
    var l=String(raw).trim();if(!l)return;
    if(/^-?\s*참고문헌\s*-?$/.test(l)){closeList();h+='<details class="refs"><summary>참고문헌</summary><ul>';inRef=true;return}
    if(inRef){h+='<li>'+esc(l)+'</li>';return}
    var m;
    if((m=l.match(/^(\d+)\.\s*(.+)$/))&&m[2].length<70){closeList();h+='<h4 class="d-h1">'+esc(m[2])+'</h4>';return}
    if((m=l.match(/^(\d+)\)\s*(.+)$/))&&m[2].length<80){closeList();h+='<h5 class="d-h2">'+esc(m[2])+'</h5>';return}
    if((m=l.match(/^[-–•]\s*(.+)$/))){closeSub();if(inList)h+='</li>';else{h+='<ul class="d-list">';inList=true}h+='<li>'+esc(m[1]);return}
    if(inList){if(!inSub){h+='<ul class="d-sub">';inSub=true}h+='<li>'+esc(l.replace(/^\*\s*/,''))+'</li>';return}
    h+='<p class="d-p">'+esc(l.replace(/^\*\s*/,''))+'</p>';
  });
  closeList();if(inRef)h+='</ul></details>';
  return h;
}
function sectionHtml(p,s){
  var h='<section class="lesson" id="sec-'+esc(s.id)+'"><div class="lesson-h">'+(s.label?'<span class="no">'+esc(s.label)+'</span>':'')+'<h2>'+esc(s.title)+'</h2></div>';

  var top='';
  if(s.objectives&&s.objectives.length)top+='<div class="blk"><h3>이 글에서 알 수 있는 것</h3>'+listHtml(s.objectives,'',true)+'</div>';
  if(s.contents&&s.contents.length)top+='<div class="blk"><h3>다루는 내용</h3>'+listHtml(s.contents,'chips')+'</div>';
  h+=(s.objectives&&s.objectives.length&&s.contents&&s.contents.length)?'<div class="two">'+top+'</div>':top;
  if(s.easy&&s.easy.length)h+='<div class="blk easy"><h3>'+esc(s.easyTitle||'쉽게 이해하기')+'</h3>'+s.easy.map(function(x){return '<p>'+esc(x)+'</p>'}).join('')+'</div>';
  if(s.key&&s.key.length)h+='<div class="blk key"><h3>핵심 이해</h3>'+s.key.map(function(x){return '<p>'+esc(x)+'</p>'}).join('')+'</div>';
  if(s.caution&&s.caution.length)h+='<div class="blk caution"><h3>이런 오해는 피하세요</h3>'+cautionHtml(s.caution)+'</div>';
  if(s.terms&&s.terms.length)h+='<details class="blk detail"><summary><span>용어 풀이</span><small>'+s.terms.length+'개</small></summary><div class="detail-b"><dl class="terms">'+s.terms.map(function(x){var i=x.search(/[:：]\s/);return i>0?'<dt>'+esc(x.slice(0,i))+'</dt><dd>'+esc(x.slice(i+1).trim())+'</dd>':'<dd>'+esc(x)+'</dd>'}).join('')+'</dl></div></details>';
  var only=!(s.easy&&s.easy.length)&&!(s.summary&&s.summary.length)&&!(s.summaryOutline&&s.summaryOutline.length)&&!s.summaryTable&&!(s.quiz||[]).length;
  if(s.detail&&s.detail.length)h+='<details class="blk detail"'+(only?' open':'')+'><summary><span>자세히 읽기</span><small>펼쳐서 전체 내용 보기</small></summary><div class="detail-b">'+detailHtml(s.detail)+'</div></details>';
  var hasSum=(s.summary&&s.summary.length)||(s.summaryOutline&&s.summaryOutline.length),hasT=s.summaryTable&&s.summaryTable.rows&&s.summaryTable.rows.length;
  if(hasSum||hasT)h+='<div class="blk"><h3>핵심 정리</h3>'+(hasSum?(s.summaryOutline&&s.summaryOutline.length?outlineHtml(s.summaryOutline):sumHtml(s.summary)):'')+(hasT?tableHtml(s.summaryTable):'')+'</div>';
  if(s.tip)h+='<div class="blk tip"><h3>현장 적용 팁</h3><p>'+esc(s.tip)+'</p></div>';
  (s.quiz||[]).forEach(function(q,i){h+=quizHtml(q,p.id+'/'+s.id+'/'+i)});
  return h+'</section>';
}
function postView(p){
  var c=catById(p.cat)||{};var all=orderedPosts();var i=all.indexOf(p);var prev=all[i-1],next=all[i+1];

function hl(text,q){var t=esc(text);if(!q)return t;var e=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return t.replace(new RegExp(e,'gi'),function(m){return '<mark>'+m+'</mark>'})}
function searchView(){
  var q=ui.q.trim();
  var h='<div class="page-h"><h1>검색</h1><p>'+(q?'“'+esc(q)+'” 검색 결과':'검색어를 입력하세요.')+'</p></div>';
  if(!q)return h;
  var ql=q.toLowerCase();var res=[];
  state.posts.forEach(function(p){
    var c=catById(p.cat)||{};
    var hitTitle=(p.title+' '+(p.label||'')).toLowerCase().indexOf(ql)>=0;
    var snips=[];
    (p.sections||[]).forEach(function(s){
      var lines=[s.title].concat(s.easy||[],s.key||[],s.caution||[],s.terms||[],s.tip?[s.tip]:[],s.objectives||[],s.contents||[],s.summaryOutline||[],(s.summary||[]).map(function(x){return String(x).replace(/^## /,'')}),s.detail||[],s.body?[s.body]:[]);
      if(s.summaryTable){lines=lines.concat(s.summaryTable.head||[]);(s.summaryTable.rows||[]).forEach(function(r){lines=lines.concat(r)})}
      (s.quiz||[]).forEach(function(z){lines.push(z.q);lines=lines.concat(z.options||[]);if(z.explain)lines.push(z.explain)});
      lines.forEach(function(l){if(String(l).toLowerCase().indexOf(ql)>=0&&snips.length<3)snips.push({s:s,l:String(l)})});
    });
    if(hitTitle||snips.length)res.push({p:p,c:c,snips:snips,score:(hitTitle?100:0)+snips.length});
  });
  res.sort(function(a,b){return b.score-a.score});
  if(!res.length)return h+'<p class="empty">일치하는 자료가 없어요. 다른 낱말로 찾아보세요.</p>';
  return h+res.map(function(r){return '<a class="result" href="#p-'+esc(r.p.id)+'" data-act="clear-search"><small>'+esc(r.c.name||'')+(r.p.label?' · '+esc(r.p.label):'')+'</small><b>'+hl(r.p.title,q)+'</b>'+r.snips.map(function(s){return '<p>'+esc(s.s.label||'')+' · '+hl(s.l.length>140?s.l.slice(0,140)+'…':s.l,q)+'</p>'}).join('')+'</a>'}).join('');
}

function buildDocument(){

  var app=document.getElementById('app').outerHTML;
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  var head='<title>PLUG 자료실</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">\n';
  return RESET+head+style+'\n<div id="root"></div>\n<script id="site-data" type="application/json">'+json+'<'+'/script>\n'+app+'</body></html>';

function save(){
  if(!ui.artifact){toast('이 화면에서는 저장할 수 없어요. 게시된 사이트에서 편집해 주세요.');return}
  try{sessionStorage.setItem(DRAFT_KEY,JSON.stringify({base:BASE,data:state}))}catch(e){}
  toast('저장하는 중…');
  ui.artifact.publish(buildDocument()).then(function(){ui.toast='저장했어요. 방문자 화면에도 반영돼요.';render()},function(e){
    var c=e&&e.code;
    if(c==='conflict'){ui.toast='다른 곳에서 먼저 저장되어 새 버전을 불러와요.';render();return}
    if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'||c==='consent_required'){ui.canEdit=false;ui.edit=false;ui.sheet=null;ui.toast='이 계정은 보기 전용이라 저장할 수 없어요.';render();return}
    if(c==='too_large'){toast('내용이 너무 커서 저장하지 못했어요. 로고 이미지를 더 작은 파일로 바꿔 보세요.');return}
    if(c==='rate_limited'){toast('저장을 너무 자주 했어요. 잠시 후 다시 눌러 주세요.');return}
    toast('저장하지 못했어요. 잠시 후 다시 시도해 주세요.');
  });
}

/* ---------- events ---------- */
root.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t)return;var a=t.getAttribute('data-act');
  if(a==='close-sheet-bg'&&ev.target!==t)return;
  var d=function(k){return t.getAttribute('data-'+k)};
  var armedBefore=ui.armed;if(['cat-del','sec-del','quiz-del','post-del','discard'].indexOf(a)<0)ui.armed=null;
  switch(a){
   case 'menu':ui.menu=true;render();break;
   case 'sec':var ss=sections()[+d('si')];if(ss){var cs=t.getAttribute('aria-expanded')==='true';ui.openSecs[ss.name]=!cs;var rl2=document.querySelector('.rail');var sc2=rl2?rl2.scrollTop:0;render();var nr2=document.querySelector('.rail');if(nr2)nr2.scrollTop=sc2}break;
   case 'grp':var gg=groups()[+d('gi')];if(gg){var cur=t.getAttribute('aria-expanded')==='true';ui.openGroups[gg.sec+'\u0001'+gg.name]=!cur;var rl=document.querySelector('.rail');var sc=rl?rl.scrollTop:0;render();var nr=document.querySelector('.rail');if(nr)nr.scrollTop=sc}break;
   case 'close-menu':ui.menu=false;render();break;
   case 'search-toggle':ui.searchOpen=!ui.searchOpen;render();if(ui.searchOpen){var q=document.getElementById('q');if(q)q.focus()}break;
   case 'clear-search':ui.q='';ui.searchOpen=false;setTimeout(render,0);break;
   case 'jump':var el=document.getElementById('sec-'+d('id'));if(el)el.scrollIntoView({behavior:'smooth',block:'start'});break;
   case 'pick':ui.quiz[d('key')]={picked:Number(d('n'))};rerenderKeep();break;
   case 'quiz-reveal':ui.quiz[d('key')]={reveal:true};rerenderKeep();break;
   case 'quiz-reset':delete ui.quiz[d('key')];rerenderKeep();break;
   case 'toggle-edit':ui.edit=!ui.edit;if(!ui.edit)ui.sheet=null;render();break;
   case 'open-settings':ui.sheet='settings';ui.tab=d('tab')||'site';render();break;
   case 'tab':ui.tab=d('tab');render();break;
   case 'close-sheet':case 'close-sheet-bg':ui.sheet=null;render();break;
   case 'edit-post':ui.sheet='post';ui.postIdx=postIndex(d('id'));render();break;
   case 'new-post':newPost(d('cat'));break;
   case 'save':save();break;
   case 'discard':if(armedBefore!=='discard'){ui.armed='discard';updateBar();break}ui.armed=null;state=JSON.parse(SAVED);ui.sheet=null;applyTheme();try{sessionStorage.removeItem(DRAFT_KEY)}catch(e){}render();break;
   case 'preset':var p=PRESETS.filter(function(x){return x.id===d('id')})[0];if(p){state.theme={brand:p.brand,accent:p.accent,header:p.header,preset:p.id};applyTheme();changed(true)}break;
   case 'cat-up':move(state.categories,+d('i'),-1);changed(true);break;
   case 'cat-down':move(state.categories,+d('i'),1);changed(true);break;
   case 'cat-add':state.categories.push({id:uid('c'),name:'새 카테고리',group:(state.categories[state.categories.length-1]||{}).group||'',section:(state.categories[state.categories.length-1]||{}).section||'',color:CAT_COLORS[state.categories.length%CAT_COLORS.length],desc:''});changed(true);setTimeout(function(){var b=document.querySelector('.sheet-b');if(b)b.scrollTop=b.scrollHeight},0);break;
   case 'cat-del':var ci=+d('i');if(armedBefore!=='cat'+ci){ui.armed='cat'+ci;render();break}
     var gone=state.categories[ci];var n=postsOf(gone.id).length;
     if(n&&state.categories.length<2){ui.armed=null;toast('자료가 있는 마지막 카테고리는 삭제할 수 없어요.');break}
     state.categories.splice(ci,1);if(n){var to=state.categories[Math.max(0,ci-1)];state.posts.forEach(function(p){if(p.cat===gone.id)p.cat=to.id});ui.toast='자료 '+n+'개를 ‘'+to.name+'’(으)로 옮겼어요.'}
     ui.armed=null;changed(true);break;
   case 'post-up':movePostWithinCat(d('id'),-1);changed(true);break;
   case 'post-down':movePostWithinCat(d('id'),1);changed(true);break;
   case 'post-del':if(armedBefore!=='post'){ui.armed='post';render();break}var gp=state.posts.splice(ui.postIdx,1)[0];ui.sheet=null;ui.armed=null;saveDraft();location.hash='c-'+gp.cat;render();break;
   case 'sec-add':var ps=state.posts[ui.postIdx];var nk=(ps.sections||[]).length+1;ps.sections=ps.sections||[];
     ps.sections.push(d('kind')==='text'?{id:uid('s'),kind:'text',label:'',title:'새 글',body:''}:{id:uid('s'),kind:'lesson',label:String(nk),title:'',objectives:[],contents:[],summary:[],quiz:[]});changed(true);break;
   case 'sec-up':move(state.posts[ui.postIdx].sections,+d('k'),-1);changed(true);break;
   case 'sec-down':move(state.posts[ui.postIdx].sections,+d('k'),1);changed(true);break;
   case 'sec-del':var sk=+d('k');if(armedBefore!=='sec'+sk){ui.armed='sec'+sk;render();break}state.posts[ui.postIdx].sections.splice(sk,1);ui.armed=null;changed(true);break;
   case 'quiz-add':var s=state.posts[ui.postIdx].sections[+d('k')];s.quiz=s.quiz||[];s.quiz.push({q:'',options:['','','',''],answer:1,explain:''});changed(true);break;
   case 'quiz-del':var key='q'+d('k')+'-'+d('z');if(armedBefore!==key){ui.armed=key;render();break}state.posts[ui.postIdx].sections[+d('k')].quiz.splice(+d('z'),1);ui.armed=null;changed(true);break;
   case 'restore-draft':try{var dr=JSON.parse(sessionStorage.getItem(DRAFT_KEY));state=dr.data;applyTheme();ui.edit=true}catch(e){}ui.notice=null;render();break;
   case 'discard-now':state=JSON.parse(SAVED);applyTheme();try{sessionStorage.removeItem(DRAFT_KEY)}catch(e){}ui.notice=null;ui.sheet=null;render();break;
   case 'drop-draft':try{sessionStorage.removeItem(DRAFT_KEY)}catch(e){}ui.notice=null;render();break;
  }
});
function rerenderKeep(){var y=window.scrollY;var m=document.getElementById('main');if(m)m.innerHTML=noticeHtml()+view(route());window.scrollTo(0,y)}
root.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='q'){ui.q=t.value;var m=document.getElementById('main');if(m)m.innerHTML=noticeHtml()+view(route());return}
  var b=t.getAttribute('data-bind');
  if(b){var v=t.value;if(t.hasAttribute('data-lines'))v=v.split('\n').map(function(x){return x.trim()}).filter(Boolean);else if(t.hasAttribute('data-num'))v=parseInt(v,10)||1;setPath(b,v);changed();refreshMain();return}
  var c=t.getAttribute('data-color');
  if(c){var val=t.value.trim();if(/^#[0-9a-fA-F]{6}$/.test(val)){state.theme[c]=val;state.theme.preset='';applyTheme();var other=document.getElementById((t.type==='color'?'ct-':'c-')+c);if(other)other.value=val;changed()}return}
  var cc=t.getAttribute('data-catcolor');
  if(cc!=null){state.categories[+cc].color=t.value;changed();refreshMain();var dt=t.closest('.box').querySelector('.box-h .dot');if(dt)dt.style.setProperty('--c',t.value)}
});
root.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='logo-file'&&t.files&&t.files[0]){var f=t.files[0];
    if(f.size>800*1024){toast('800KB 이하 이미지만 쓸 수 있어요.');return}
    var r=new FileReader();r.onload=function(){state.site.logo=r.result;state.site.logoDark='';state.site.logoWhite='';changed(true)};r.readAsDataURL(f)}
});
root.addEventListener('keydown',function(ev){if(ev.key==='Escape'){if(ui.sheet){ui.sheet=null;render()}else if(ui.menu){ui.menu=false;render()}}});
root.addEventListener('search',function(ev){if(ev.target.id==='q'){ui.q=ev.target.value;render()}},true);
window.addEventListener('hashchange',function(){ui.menu=false;ui.armed=null;if(ui.q&&route().v!=='search'){ui.q=''}render();window.scrollTo(0,0)});

/* ---------- boot ---------- */
(function(){
  try{var raw=sessionStorage.getItem(DRAFT_KEY);if(raw){var dr=JSON.parse(raw);var same=JSON.stringify(dr.data)===SAVED;
    if(same){sessionStorage.removeItem(DRAFT_KEY)}
    else if(dr.base===BASE){state=dr.data;ui.edit=true;ui.notice={html:'저장하지 않은 편집 내용을 이어서 불러왔어요. <button class="btn" data-act="discard-now">편집 내용 버리기</button>'}}
    else ui.notice={html:'다른 곳에서 먼저 저장되어 내 편집 내용이 반영되지 않았어요. <button class="btn pri" data-act="restore-draft">내 편집 내용 다시 불러오기</button><button class="btn ghost" data-act="drop-draft">버리기</button>'}}}catch(e){}
  applyTheme();render();
  var dev=location.protocol==='file:'||/[?&]dev\b/.test(location.search);
  if(dev){ui.canEdit=true;render()}
  whenClaude(function(ok){if(ok){
    Promise.all([window.claude.use('artifact'),window.claude.use('user')]).then(function(r){
      ui.artifact=r[0];var u=r[1];
      if(!ui.artifact){if(!dev&&ui.notice){ui.notice=null;render()}return}
      return (u?u.canEdit():Promise.resolve(false)).then(function(ok){ui.canEdit=!!ok||dev;if(!ui.canEdit){ui.edit=false;ui.notice=null}render()});
    }).catch(function(){});
  } else if(!dev){ui.edit=false;ui.notice=null;render()}});
})();
function whenClaude(cb){var n=0;(function t(){if(window.claude&&window.claude.use)return cb(true);if(++n>60)return cb(false);setTimeout(t,100)})()}
})();
</script>
